<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CNC Machining Simulation | JMC Engineering</title>
<meta name="description" content="Parametric 3D CNC simulation — peck drilling, rigid tapping, counterbore and countersink on a die plate, with fastener fit-check and true cross-section view. JMC Engineering, Chennai."/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#050a18;--navy:#0d2250;--blue:#2563eb;--line:#60a5fa;
  --text:#e2e8f0;--muted:#94a3b8;--green:#4ade80;--amber:#fbbf24;--orange:#fb923c;
  --mono:'IBM Plex Mono',monospace;--disp:'Chakra Petch',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--ink);color:var(--text);overflow:hidden;height:100vh;width:100vw;}
#canvas-container{position:fixed;inset:0;z-index:0;}

/* TOP BAR */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(180deg,rgba(5,10,24,.95),rgba(5,10,24,0));pointer-events:none;}
.top-bar>*{pointer-events:auto;}
.back-btn{color:rgba(255,255,255,.55);font-size:13px;font-weight:500;text-decoration:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:8px 16px;border-radius:8px;transition:.2s;display:flex;align-items:center;gap:6px;}
.back-btn:hover{color:#fff;background:rgba(255,255,255,.12);}
.size-badge{font-family:var(--disp);font-weight:700;font-size:26px;color:#fff;display:flex;align-items:center;gap:12px;}
.size-badge .dot{width:9px;height:9px;background:var(--blue);border-radius:50%;box-shadow:0 0 12px var(--blue);}
.size-badge .sub{font-size:11px;font-weight:400;color:var(--muted);font-family:var(--mono);display:block;letter-spacing:.5px;}

/* PROGRESS / SCRUB BAR */
.progress-wrap{position:fixed;top:0;left:0;right:0;z-index:120;height:5px;background:rgba(255,255,255,.06);cursor:pointer;}
.progress-wrap:hover{height:9px;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--line));transition:height .15s;pointer-events:none;}
.phase-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22);pointer-events:none;}
.phase-label{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:110;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--line);letter-spacing:1.6px;text-transform:uppercase;background:rgba(5,10,24,.75);border:1px solid rgba(96,165,250,.22);padding:7px 18px;border-radius:6px;backdrop-filter:blur(8px);white-space:nowrap;}

/* TOOL INDICATOR */
.tool-indicator{position:fixed;top:62px;left:20px;z-index:110;background:rgba(5,10,24,.85);border:1px solid rgba(37,99,235,.22);padding:10px 14px;border-radius:10px;backdrop-filter:blur(10px);min-width:172px;}
.ti-label{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;}
.ti-value{font-family:var(--disp);font-size:17px;font-weight:700;color:#fff;margin-top:3px;}
.ti-dia{font-family:var(--mono);font-size:11.5px;color:var(--line);margin-top:2px;}
.ti-rpm{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}

/* BOTTOM SPEC BAR */
.bottom-panel{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 16px 14px;pointer-events:none;}
.spec-bar{display:flex;gap:2px;background:rgba(5,14,36,.85);border:1px solid rgba(37,99,235,.16);border-radius:12px;padding:4px;backdrop-filter:blur(12px);pointer-events:auto;max-width:760px;margin:0 auto;}
.spec-item{flex:1;text-align:center;padding:9px 6px;border-radius:8px;transition:background .25s;}
.spec-item.active{background:rgba(37,99,235,.2);}
.spec-label{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
.spec-value{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--line);}
.spec-item.active .spec-value{color:#fff;}

/* PROJECTED 3D CALLOUTS */
.co{position:fixed;z-index:90;transform:translate(-50%,-110%);background:rgba(5,10,24,.92);border:1.5px solid var(--blue);padding:6px 12px;border-radius:7px;backdrop-filter:blur(8px);opacity:0;transition:opacity .5s;pointer-events:none;}
.co.show{opacity:1;}
.co.green{border-color:var(--green);}.co.amber{border-color:var(--amber);}.co.orange{border-color:var(--orange);}
.co .t{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;display:block;}
.co .v{font-family:var(--mono);font-size:13.5px;font-weight:700;color:#fff;}
.co.green .v{color:var(--green);}.co.amber .v{color:var(--amber);}.co.orange .v{color:var(--orange);}
.co::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:1.5px;height:7px;background:inherit;border-left:1.5px solid;border-color:inherit;}

/* PLAYBACK CONTROLS */
.pb{position:fixed;bottom:78px;right:18px;z-index:100;display:flex;gap:8px;}
.pb button{background:rgba(37,99,235,.18);border:1px solid rgba(37,99,235,.3);color:var(--line);font-family:var(--disp);font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px;letter-spacing:.4px;}
.pb button:hover{background:rgba(37,99,235,.34);transform:translateY(-1px);}
.pb button svg{width:14px;height:14px;fill:currentColor;stroke:none;}
.pb button.icon-stroke svg{fill:none;stroke:currentColor;stroke-width:2;}

/* LOADER */
.loader{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s,visibility .5s;}
.loader.hidden{opacity:0;visibility:hidden;}
.loader-logo{display:flex;align-items:center;gap:12px;}
.loader-logo img{width:42px;height:42px;border-radius:50%;object-fit:contain;}
.loader-logo span{font-family:var(--disp);font-size:21px;font-weight:700;color:#fff;}
.loader-logo span em{color:var(--line);font-style:normal;}
.loader-spinner{width:44px;height:44px;border:3px solid rgba(37,99,235,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:1.2px;}

/* MISC */
.watermark{position:fixed;bottom:16px;left:18px;z-index:100;display:flex;align-items:center;gap:8px;opacity:.35;pointer-events:none;}
.watermark img{width:18px;height:18px;border-radius:50%;}
.watermark span{font-family:var(--disp);font-size:11px;font-weight:600;color:#fff;letter-spacing:1px;}
.controls-hint{position:fixed;top:62px;right:18px;z-index:110;background:rgba(5,10,24,.7);border:1px solid rgba(255,255,255,.06);padding:8px 12px;border-radius:8px;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.4);line-height:1.8;backdrop-filter:blur(8px);text-align:right;}
@media(max-width:760px){.controls-hint{display:none;}.size-badge{font-size:20px;}.spec-value{font-size:11px;}}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-logo"><img src="logo.png" alt="JMC Engineering" onerror="this.style.display='none'"/><span>JMC <em>Engineering</em></span></div>
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderSub">LOADING SIMULATION ENGINE</div>
</div>

<div id="canvas-container"></div>

<div class="progress-wrap" id="progressWrap"><div class="progress-fill" id="progressFill"></div></div>

<div class="top-bar">
  <div class="size-badge"><div class="dot"></div><div><span id="sizeTitle">M10</span><span class="sub" id="sizeSub"></span></div></div>
  <a href="drill-calculator.html" class="back-btn">&larr; Back to Drill Chart</a>
</div>

<div class="phase-label" id="phaseLabel">INITIALIZING</div>

<div class="tool-indicator">
  <div class="ti-label">Active Tool</div>
  <div class="ti-value" id="toolName">&mdash; IDLE &mdash;</div>
  <div class="ti-dia" id="toolDia">&mdash;</div>
  <div class="ti-rpm" id="toolRpm">S0 RPM &middot; F0</div>
</div>

<div class="controls-hint">DRAG &middot; ORBIT<br/>SCROLL &middot; ZOOM<br/>BAR &middot; SCRUB TIMELINE</div>

<div class="bottom-panel">
  <div class="spec-bar">
    <div class="spec-item" id="specItemTap"><div class="spec-label">Tap Drill</div><div class="spec-value" id="specTap"></div></div>
    <div class="spec-item" id="specItemClr"><div class="spec-label">Clearance</div><div class="spec-value" id="specClr"></div></div>
    <div class="spec-item" id="specItemCb"><div class="spec-label">Counterbore</div><div class="spec-value" id="specCb"></div></div>
    <div class="spec-item" id="specItemCsk"><div class="spec-label">Countersink</div><div class="spec-value" id="specCsk"></div></div>
  </div>
</div>

<!-- projected callouts -->
<div class="co green"  id="coTap"><span class="t">Tapped Hole</span><span class="v" id="coTapV"></span></div>
<div class="co amber"  id="coCb"><span class="t">C'Bore &middot; SHCS</span><span class="v" id="coCbV"></span></div>
<div class="co orange" id="coCsk"><span class="t">CSK 90&deg; &middot; FHCS</span><span class="v" id="coCskV"></span></div>

<div class="pb">
  <button id="btnSound" class="icon-stroke" title="Sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM18 8a6 6 0 010 8"/></svg></button>
  <button id="btnSpeed" title="Playback speed">1&times;</button>
  <button id="btnPlay" title="Play / Pause"><svg viewBox="0 0 24 24" id="playIco"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
  <button id="btnReplay" class="icon-stroke" title="Replay"><svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> REPLAY</button>
</div>

<div class="watermark"><img src="logo.png" alt="" onerror="this.style.display='none'"/><span>JMC ENGINEERING &middot; PADI, CHENNAI</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        onerror="document.getElementById('loaderSub').textContent='COULD NOT LOAD 3D ENGINE — CHECK CONNECTION'"></script>
<script>
'use strict';
if (!window.THREE){ document.getElementById('loaderSub').textContent = 'COULD NOT LOAD 3D ENGINE — CHECK CONNECTION'; throw new Error('three missing'); }

/* ════════════════ ORBIT CONTROLS (inline, r128-safe) ════════════════ */
THREE.OrbitControls=function(object,domElement){
  this.object=object;this.domElement=domElement;this.enabled=true;
  this.target=new THREE.Vector3();this.minDistance=0;this.maxDistance=Infinity;
  this.minPolarAngle=0;this.maxPolarAngle=Math.PI;this.enableDamping=false;this.dampingFactor=.05;this.enableZoom=true;
  var scope=this,STATE={NONE:-1,ROTATE:0,DOLLY:1,PAN:2},state=STATE.NONE;
  var spherical=new THREE.Spherical(),sphericalDelta=new THREE.Spherical();
  var scale=1,panOffset=new THREE.Vector3(),zoomChanged=false;
  var rotateStart=new THREE.Vector2(),rotateEnd=new THREE.Vector2(),rotateDelta=new THREE.Vector2();
  var panStart=new THREE.Vector2(),panEnd=new THREE.Vector2(),panDelta=new THREE.Vector2();
  var pinchStart=0;
  var offset=new THREE.Vector3(),quat=new THREE.Quaternion().setFromUnitVectors(object.up,new THREE.Vector3(0,1,0));
  var quatInverse=quat.clone().invert(),lastPosition=new THREE.Vector3(),lastQuaternion=new THREE.Quaternion(),EPS=1e-6;
  function pan(dx,dy){var el=scope.domElement,pos=scope.object.position,o=pos.clone().sub(scope.target),td=o.length()*Math.tan((scope.object.fov/2)*Math.PI/180);
    var v=new THREE.Vector3();v.setFromMatrixColumn(scope.object.matrix,0);v.multiplyScalar(-2*dx*td/el.clientHeight);panOffset.add(v);
    v.setFromMatrixColumn(scope.object.matrix,1);v.multiplyScalar(2*dy*td/el.clientHeight);panOffset.add(v);}
  this.update=function(){
    offset.copy(scope.object.position).sub(scope.target);offset.applyQuaternion(quat);
    spherical.setFromVector3(offset);
    if(scope.enableDamping){spherical.theta+=sphericalDelta.theta*scope.dampingFactor;spherical.phi+=sphericalDelta.phi*scope.dampingFactor;}
    else{spherical.theta+=sphericalDelta.theta;spherical.phi+=sphericalDelta.phi;}
    spherical.phi=Math.max(scope.minPolarAngle,Math.min(scope.maxPolarAngle,spherical.phi));spherical.makeSafe();
    spherical.radius=Math.max(scope.minDistance,Math.min(scope.maxDistance,spherical.radius*scale));
    scope.target.add(panOffset);
    offset.setFromSpherical(spherical);offset.applyQuaternion(quatInverse);
    scope.object.position.copy(scope.target).add(offset);scope.object.lookAt(scope.target);
    if(scope.enableDamping){sphericalDelta.theta*=(1-scope.dampingFactor);sphericalDelta.phi*=(1-scope.dampingFactor);panOffset.multiplyScalar(1-scope.dampingFactor);}
    else{sphericalDelta.set(0,0,0);panOffset.set(0,0,0);}
    scale=1;
    if(zoomChanged||lastPosition.distanceToSquared(scope.object.position)>EPS||8*(1-lastQuaternion.dot(scope.object.quaternion))>EPS){
      lastPosition.copy(scope.object.position);lastQuaternion.copy(scope.object.quaternion);zoomChanged=false;return true;}
    return false;};
  function down(x,y,btn){state=btn===2?STATE.PAN:STATE.ROTATE;rotateStart.set(x,y);panStart.set(x,y);}
  function move(x,y){
    if(state===STATE.ROTATE){rotateEnd.set(x,y);rotateDelta.subVectors(rotateEnd,rotateStart).multiplyScalar(2*Math.PI/scope.domElement.clientHeight);
      sphericalDelta.theta-=rotateDelta.x;sphericalDelta.phi-=rotateDelta.y;rotateStart.copy(rotateEnd);}
    else if(state===STATE.PAN){panEnd.set(x,y);panDelta.subVectors(panEnd,panStart);pan(panDelta.x,panDelta.y);panStart.copy(panEnd);}}
  domElement.addEventListener('contextmenu',e=>e.preventDefault());
  domElement.addEventListener('pointerdown',e=>{if(!scope.enabled)return;domElement.setPointerCapture(e.pointerId);down(e.clientX,e.clientY,e.button);});
  domElement.addEventListener('pointermove',e=>{if(!scope.enabled||state===STATE.NONE)return;move(e.clientX,e.clientY);});
  domElement.addEventListener('pointerup',()=>{state=STATE.NONE;});
  domElement.addEventListener('wheel',e=>{if(!scope.enabled||!scope.enableZoom)return;e.preventDefault();scale*=(e.deltaY<0?0.95:1/0.95);zoomChanged=true;},{passive:false});
  domElement.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
  domElement.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart>0){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale*=pinchStart/d;pinchStart=d;zoomChanged=true;}},{passive:true});
  this.update();
};

/* ════════════════ PARAMETERS — everything below derives from these ════════════════ */
const q = new URLSearchParams(location.search);
const P = {
  size : q.get('size') || 'M10',
  tap  : parseFloat(q.get('tap'))   || 8.5,   // tap drill Ø mm
  pitch: parseFloat(q.get('pitch')) || 1.5,   // thread pitch mm
  cl   : parseFloat(q.get('cl'))    || 10.5,  // clearance drill Ø mm
  cb   : parseFloat(q.get('cb'))    || 16.0,  // counterbore Ø mm
  cbd  : parseFloat(q.get('cbd'))   || 10.0,  // counterbore depth mm
  csk  : parseFloat(q.get('csk'))   || 18.5,  // countersink Ø mm
};
P.major = P.tap + P.pitch;                            // thread major Ø (M-size)
const PLATE = {};
PLATE.s   = Math.max(26, P.csk*1.5, P.cb*1.7);        // hole spacing mm
PLATE.W   = 2*PLATE.s + P.csk + 28;                   // plate width mm
PLATE.D   = Math.max(42, P.csk + 24);                 // plate depth mm
PLATE.T   = Math.min(34, Math.max(14, P.tap*1.9 + 4));// plate thickness mm
P.cbd     = Math.min(P.cbd, PLATE.T*0.55);
P.cskd    = Math.min((P.csk - P.cl)/2, PLATE.T*0.45); // 90° incl. → depth=(D-d)/2
const K   = 6.8 / PLATE.W;                            // mm → scene units
const mm  = v => v*K;

/* hole centre X (scene units): tap | counterbore | countersink */
const HX = [ -mm(PLATE.s), 0, mm(PLATE.s) ];
const R = {
  tap : mm(P.tap)/2, major: mm(P.major)/2, cl: mm(P.cl)/2,
  cb  : mm(P.cb)/2,  csk : mm(P.csk)/2,
};
const T_U = mm(PLATE.T), CBD_U = mm(P.cbd), CSKD_U = mm(P.cskd);

/* UI text */
const fmt = v => (Math.round(v*100)/100).toString();
document.getElementById('sizeTitle').textContent = P.size;
document.getElementById('sizeSub').textContent   = P.size + '\u00d7' + P.pitch + ' \u00b7 PLATE ' + Math.round(PLATE.T) + 'mm \u00b7 3-HOLE JOB';
document.getElementById('specTap').textContent  = '\u2300 ' + fmt(P.tap);
document.getElementById('specClr').textContent  = '\u2300 ' + fmt(P.cl);
document.getElementById('specCb').textContent   = '\u2300 ' + fmt(P.cb) + ' \u00d7 ' + fmt(P.cbd);
document.getElementById('specCsk').textContent  = '\u2300 ' + fmt(P.csk) + ' \u00d7 90\u00b0';
document.getElementById('coTapV').textContent   = P.size + '\u00d7' + P.pitch + ' (drill \u2300' + fmt(P.tap) + ')';
document.getElementById('coCbV').textContent    = '\u2300' + fmt(P.cb) + ' \u00d7 ' + fmt(P.cbd) + ' deep';
document.getElementById('coCskV').textContent   = '\u2300' + fmt(P.csk) + ' \u00d7 ' + fmt(P.cskd) + ' deep';

/* ════════════════ SCENE ════════════════ */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050a18);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(15, 9, 12);
const isMobile = innerWidth < 768;
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1 : 1.5));
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.localClippingEnabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 36;
controls.maxPolarAngle = Math.PI*0.49;
controls.update();

/* lights */
scene.add(new THREE.AmbientLight(0x1a2744, 0.7));
const sun = new THREE.DirectionalLight(0xc8d6f2, 1.2);
sun.position.set(8,18,10); sun.castShadow = !isMobile;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=.5; sun.shadow.camera.far=50;
sun.shadow.camera.left=-14; sun.shadow.camera.right=14; sun.shadow.camera.top=14; sun.shadow.camera.bottom=-14;
sun.shadow.bias=-0.0003; scene.add(sun);
const fill = new THREE.DirectionalLight(0x3b6fd4, 0.4); fill.position.set(-6,8,-5); scene.add(fill);
const spot = new THREE.SpotLight(0xfff0dd, 0.85, 26, Math.PI*0.17, 0.45);
spot.position.set(0,14,2); scene.add(spot);
const cutGlow = new THREE.PointLight(0xff7733, 0, 5); scene.add(cutGlow);
const sectLight = new THREE.PointLight(0x9db8e8, 0, 22); sectLight.position.set(0,4.6,7); scene.add(sectLight);

/* clipping plane for the section view (z <= c visible) */
const clipPlane = new THREE.Plane(new THREE.Vector3(0,0,-1), 100);

/* materials */
function std(o){ return new THREE.MeshStandardMaterial(o); }
const M = {
  floor : std({color:0x0a1628, roughness:.7, metalness:.3}),
  iron  : std({color:0x3a3f47, roughness:.65, metalness:.4}),
  paint : std({color:0x46526a, roughness:.5, metalness:.3}),
  chrome: std({color:0xb0b8c8, roughness:.15, metalness:.9}),
  hss   : std({color:0x95a3b5, roughness:.28, metalness:.85}),
  carbide: std({color:0x4a505c, roughness:.25, metalness:.9}),
  gold  : std({color:0xc2a05e, roughness:.32, metalness:.85}),
  navy  : std({color:0x0d2250, roughness:.4, metalness:.3}),
  accent: std({color:0x2563eb, roughness:.3, metalness:.5, emissive:0x2563eb, emissiveIntensity:.15}),
  dark  : std({color:0x2d3540, roughness:.55, metalness:.5}),
  jaw   : std({color:0x555d68, roughness:.25, metalness:.8}),
  blackOx: std({color:0x23272e, roughness:.45, metalness:.7}),
};
/* plate steel — clipped by section plane */
const plateMat  = std({color:0x7f8ea2, roughness:.34, metalness:.72, clippingPlanes:[clipPlane], clipShadows:true, side:THREE.DoubleSide});
const machined  = std({color:0x9aa9bd, roughness:.22, metalness:.8,  clippingPlanes:[clipPlane], side:THREE.DoubleSide});
const threadMat = std({color:0xb9c6d8, roughness:.25, metalness:.85, clippingPlanes:[clipPlane], side:THREE.DoubleSide});
const fastMat   = std({color:0x2b3038, roughness:.4,  metalness:.75, clippingPlanes:[clipPlane], side:THREE.DoubleSide});
const fastMat2  = std({color:0x343b45, roughness:.38, metalness:.78, clippingPlanes:[clipPlane], side:THREE.DoubleSide});
/* clipped clones for the vise so the section cuts through the fixture too */
const ironC = std({color:0x3a3f47, roughness:.65, metalness:.4, clippingPlanes:[clipPlane], side:THREE.DoubleSide});

/* ════════════════ TOOLS — all sized from chart params ════════════════ */
function twistDrill(r, mat, fluteMat, lenU){
  const g=new THREE.Group(), tipH=r*1.2, fl=lenU;
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.16,r*.7),Math.max(.16,r*.7),.9,14),mat); shank.position.y=-.45; g.add(shank);
  const taper=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.16,r*.7),r,.3,14),mat); taper.position.y=-1.05; g.add(taper);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,fl,16),mat); body.position.y=-1.2-fl/2; g.add(body);
  for(let f=0;f<2;f++){ const pts=[];
    for(let s=0;s<=26;s++){const t=s/26,y=-1.2-t*fl,a=t*Math.PI*6+f*Math.PI;pts.push(new THREE.Vector3(Math.cos(a)*r*.92,y,Math.sin(a)*r*.92));}
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),22,Math.max(.02,r*.16),5,false),fluteMat)); }
  const tip=new THREE.Mesh(new THREE.ConeGeometry(r,tipH,16),mat); tip.position.y=-1.2-fl-tipH/2; g.add(tip);
  g.userData={tip:-1.2-fl-tipH, tipH, r};
  return g;
}
function tapTool(){
  const g=new THREE.Group(), r=R.major, fl=T_U+1.0;
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.15,r*.6),Math.max(.15,r*.6),1.0,12),M.hss); shank.position.y=-.5; g.add(shank);
  const sq=new THREE.Mesh(new THREE.BoxGeometry(r*1.1,.3,r*1.1),M.hss); sq.position.y=-.05; g.add(sq);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,fl,14),M.hss); body.position.y=-1.0-fl/2; g.add(body);
  const ridges=Math.max(6,Math.round(fl/Math.max(.06,mm(P.pitch))));
  for(let i=0;i<Math.min(ridges,26);i++){ const y=-1.05-(i+0.5)*fl/Math.min(ridges,26);
    const t=new THREE.Mesh(new THREE.TorusGeometry(r*1.02,Math.max(.015,r*.08),5,18),M.chrome); t.rotation.x=Math.PI/2; t.position.y=y; g.add(t); }
  for(let f=0;f<3;f++){ const fluteCut=new THREE.Mesh(new THREE.BoxGeometry(r*.32,fl,r*.32),M.blackOx);
    const a=f/3*Math.PI*2; fluteCut.position.set(Math.cos(a)*r*.92,-1.0-fl/2,Math.sin(a)*r*.92); g.add(fluteCut); }
  const tip=new THREE.Mesh(new THREE.ConeGeometry(r,r*.9,12),M.hss); tip.position.y=-1.0-fl-r*.45; g.add(tip);
  g.userData={tip:-1.0-fl-r*.9, tipH:r*.9, r};
  return g;
}
function cbTool(){
  const g=new THREE.Group(), r=R.cb, pr=R.cl*0.96, fl=CBD_U+1.4, pl=T_U*0.7;
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.18,r*.5),Math.max(.18,r*.5),.9,14),M.carbide); shank.position.y=-.45; g.add(shank);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,fl,18),M.carbide); body.position.y=-1.0-fl/2; g.add(body);
  for(let f=0;f<3;f++){ const a=f/3*Math.PI*2;
    const fp=new THREE.Mesh(new THREE.BoxGeometry(r*.22,fl,r*1.9),M.blackOx); fp.position.y=-1.0-fl/2; fp.rotation.y=a; g.add(fp); }
  const face=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.07,18),M.gold); face.position.y=-1.0-fl; g.add(face);
  const pilot=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,pl,14),M.hss); pilot.position.y=-1.0-fl-pl/2; g.add(pilot);
  g.userData={tip:-1.0-fl-pl, cutFace:-1.0-fl, tipH:0, r};
  return g;
}
function cskTool(){
  const g=new THREE.Group(), r=R.csk, coneH=r;       // 90° included
  const shank=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.18,r*.45),Math.max(.18,r*.45),1.1,14),M.carbide); shank.position.y=-.55; g.add(shank);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(.18,r*.45),r,1.2,16),M.carbide); neck.position.y=-1.7; g.add(neck);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(r,coneH,22),M.gold); cone.position.y=-2.3-coneH/2; g.add(cone);
  for(let f=0;f<4;f++){ const fp=new THREE.Mesh(new THREE.BoxGeometry(.025,coneH*.9,r*1.25),M.blackOx);
    fp.position.y=-2.3-coneH/2; fp.rotation.y=f/4*Math.PI*2; g.add(fp); }
  g.userData={tip:-2.3-coneH, coneTop:-2.3, tipH:coneH, r};
  return g;
}

/* plate body: extruded with 3 through-holes at each feature's LARGEST Ø */
(function(){
  const sh=new THREE.Shape();
  const w=mm(PLATE.W)/2, d=mm(PLATE.D)/2;
  sh.moveTo(-w,-d); sh.lineTo(w,-d); sh.lineTo(w,d); sh.lineTo(-w,d); sh.closePath();
  const holes=[[HX[0],R.tap],[HX[1],R.cb],[HX[2],R.csk]];
  holes.forEach(([x,r])=>{ const p=new THREE.Path(); p.absarc(x,0,r,0,Math.PI*2,true); sh.holes.push(p); });
  const geo=new THREE.ExtrudeGeometry(sh,{depth:T_U,bevelEnabled:false,curveSegments:36});
  geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,plateMat);
  mesh.position.y=PLATE_BOT; mesh.castShadow=mesh.receiveShadow=true; vise.add(mesh);
})();

/* liners = final machined surfaces hidden under the plugs (lathe profiles) */
function lathe(pts,seg){ return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg||36); }
/* CB hole liner: inner wall Øcl from bottom→(top-cbd), then flat CB floor out to Øcb */
const cbLiner=new THREE.Mesh(lathe([[R.cl,PLATE_BOT],[R.cl,PLATE_TOP-CBD_U],[R.cb,PLATE_TOP-CBD_U]]),machined);
cbLiner.position.x=HX[1]; vise.add(cbLiner);
/* CSK hole liner: inner wall Øcl from bottom→(top-cskd), then 45° cone out to Øcsk at top */
const cskLiner=new THREE.Mesh(lathe([[R.cl,PLATE_BOT],[R.cl,PLATE_TOP-CSKD_U],[R.csk,PLATE_TOP]]),machined);
cskLiner.position.x=HX[2]; vise.add(cskLiner);

/* plugs = stock still to be removed (same material → plate looks solid until cut) */
const plugMat=std({color:0x7f8ea2,roughness:.34,metalness:.72,clippingPlanes:[clipPlane],side:THREE.DoubleSide});
function makePlug(geo,x){ const m=new THREE.Mesh(geo,plugMat); m.position.x=x; vise.add(m); return m; }
const plugTap = makePlug(new THREE.CylinderGeometry(R.tap*0.998,R.tap*0.998,T_U,28),HX[0]);
const plugCb1 = makePlug(new THREE.CylinderGeometry(R.cl*0.998,R.cl*0.998,T_U,28),HX[1]);     // clearance pass
const plugCsk1= makePlug(new THREE.CylinderGeometry(R.cl*0.998,R.cl*0.998,T_U,28),HX[2]);
/* ring plugs (stock the CB / CSK cutters remove) — extruded rings: flat tops, no z-fight */
function ringPlug(rIn,rOut,depth,x){
  const sh=new THREE.Shape(); sh.absarc(0,0,rOut,0,Math.PI*2,false);
  const h=new THREE.Path(); h.absarc(0,0,rIn,0,Math.PI*2,true); sh.holes.push(h);
  const g=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false,curveSegments:32});
  g.rotateX(-Math.PI/2);                       // spans local y 0..depth
  const m=new THREE.Mesh(g,plugMat); m.position.x=x; vise.add(m); return m;
}
const plugCb2  = ringPlug(R.cl*1.002,R.cb*0.998,CBD_U,HX[1]);
const plugCsk2 = ringPlug(R.cl*1.002,R.csk*0.998,CSKD_U,HX[2]);
function setCylPlug(plug, depthU){           // shrink a full-height cylinder plug from the top
  const h=Math.max(0.0001,T_U-depthU);
  plug.scale.y=h/T_U;
  plug.position.y=PLATE_BOT+h/2;
  plug.visible=depthU<T_U-0.001;
}
setCylPlug(plugTap,0); setCylPlug(plugCb1,0); setCylPlug(plugCsk1,0);
/* ring plug: keep its TOP flush with plate top while the cutter consumes it downward */
function setRingPlugTopDown(plug, frac, depthU){
  const s=Math.max(0.0001,1-Math.min(1,Math.max(0,frac)));
  plug.scale.y=s;
  plug.position.y=PLATE_TOP - s*depthU;      // local geometry top = position.y + s*depth = PLATE_TOP
  plug.visible=frac<0.999;
}
setRingPlugTopDown(plugCb2,0,CBD_U); setRingPlugTopDown(plugCsk2,0,CSKD_U);

/* thread helix inside tapped hole (revealed progressively while tapping) */
let threadMesh=null, threadTotal=0;
(function(){
  const turns=Math.max(4,Math.round(PLATE.T/P.pitch));
  const segPerTurn=14, total=turns*segPerTurn;
  const pts=[];
  const rc=(R.tap+R.major)/2;
  for(let i=0;i<=total;i++){ const t=i/total, a=t*turns*Math.PI*2, y=PLATE_TOP-0.02-t*(T_U-0.04);
    pts.push(new THREE.Vector3(Math.cos(a)*rc,y,Math.sin(a)*rc)); }
  const tubeR=Math.max(0.012,(R.major-R.tap)*0.62);
  const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),total,tubeR,5,false);
  threadMesh=new THREE.Mesh(geo,threadMat); threadMesh.position.x=HX[0]; threadMesh.visible=false; vise.add(threadMesh);
  threadTotal=geo.index.count;
  geo.setDrawRange(0,0);
})();

/* ════════════════ FASTENERS (the “why” of the chart) ════════════════ */
function hexBolt(){ // into tapped hole
  const g=new THREE.Group(), r=R.major*0.97, hh=R.major*0.65, hr=R.major*0.95;
  const headM=new THREE.Mesh(new THREE.CylinderGeometry(hr,hr,hh,6),fastMat); headM.position.y=hh/2; g.add(headM);
  const washerish=new THREE.Mesh(new THREE.CylinderGeometry(hr*1.05,hr*1.05,hh*0.18,18),fastMat2); washerish.position.y=hh*0.09; g.add(washerish);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,T_U+0.25,16),fastMat2); body.position.y=-(T_U+0.25)/2; g.add(body);
  for(let i=0;i<10;i++){ const t=new THREE.Mesh(new THREE.TorusGeometry(r*1.01,r*0.06,4,14),fastMat);
    t.rotation.x=Math.PI/2; t.position.y=-0.15-(i/10)*(T_U); g.add(t); }
  g.userData={seatY:PLATE_TOP_W};       // washer face lands on plate top
  return g;
}
function shcs(){ // socket head cap screw into counterbore
  const g=new THREE.Group(), hr=R.cb*0.93, hh=CBD_U*0.96, r=R.major*0.92;
  const headM=new THREE.Mesh(new THREE.CylinderGeometry(hr,hr,hh,24),fastMat); headM.position.y=hh/2; g.add(headM);
  const knurl=new THREE.Mesh(new THREE.CylinderGeometry(hr*1.001,hr*1.001,hh*0.3,24),fastMat2); knurl.position.y=hh*0.82; g.add(knurl);
  const hex=new THREE.Mesh(new THREE.CylinderGeometry(hr*0.42,hr*0.42,hh*0.5,6),M.blackOx); hex.position.y=hh*0.78; g.add(hex);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,T_U+0.4,16),fastMat2); body.position.y=-(T_U+0.4)/2; g.add(body);
  g.userData={seatY:PLATE_TOP_W-CBD_U};  // head底 seats on CB floor → head top flush with plate
  return g;
}
function fhcs(){ // flat-head (countersunk) screw
  const g=new THREE.Group(), hr=R.csk*0.985, hh=CSKD_U, r=R.cl*0.9;
  const cone=new THREE.Mesh(new THREE.CylinderGeometry(hr,Math.max(r*0.9,hr-hh),hh,24),fastMat); cone.position.y=-hh/2; g.add(cone);
  const slot=new THREE.Mesh(new THREE.BoxGeometry(hr*1.5,0.03,hr*0.22),M.blackOx); slot.position.y=0.012; g.add(slot);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,T_U,16),fastMat2); body.position.y=-hh-T_U/2+0.05; g.add(body);
  g.userData={seatY:PLATE_TOP_W};        // head top lands flush with plate top
  return g;
}

function pool(n,geo,matFn){ const a=[]; for(let i=0;i<n;i++){ const m=matFn(); const me=new THREE.Mesh(geo,m); me.visible=false; scene.add(me);
  a.push({mesh:me,mat:m,vel:new THREE.Vector3(),ang:new THREE.Vector3(),life:0,max:0,on:false}); } return a; }
const chips = pool(46,new THREE.BoxGeometry(0.05,0.018,0.16),()=>std({color:0xff7733,emissive:0xff4400,emissiveIntensity:.6,roughness:.4,metalness:.5,transparent:true,opacity:0}));
const sparks= pool(20,new THREE.SphereGeometry(0.026,6,6),()=>new THREE.MeshBasicMaterial({color:0xffdd66,transparent:true,opacity:0}));
const drops = pool(36,new THREE.SphereGeometry(0.03,6,6),()=>new THREE.MeshBasicMaterial({color:0x6db4ff,transparent:true,opacity:0}));
function emit(arr,init){ for(const p of arr){ if(!p.on){ p.on=true; p.mesh.visible=true; init(p); return; } } }
function spawnChip(x,y,r){ emit(chips,p=>{ const a=Math.random()*Math.PI*2,rr=r*(0.7+Math.random()*0.4);
  p.mesh.position.set(x+Math.cos(a)*rr,y+0.05,Math.sin(a)*rr);
  const os=0.05+Math.random()*0.07,us=0.07+Math.random()*0.06;
  p.vel.set(Math.cos(a)*os,us,Math.sin(a)*os); p.ang.set((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5);
  p.mesh.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  p.life=0;p.max=0.9+Math.random()*0.6;p.mat.opacity=1;p.mat.emissiveIntensity=.7;p.mat.color.setRGB(1,.5,.2); }); }
function spawnSpark(x,y,r){ emit(sparks,p=>{ const a=Math.random()*Math.PI*2;
  p.mesh.position.set(x+Math.cos(a)*r*.6,y+0.02,Math.sin(a)*r*.6);
  const sp=0.10+Math.random()*0.10; p.vel.set(Math.cos(a)*sp,0.05+Math.random()*0.08,Math.sin(a)*sp);
  p.life=0;p.max=0.3+Math.random()*0.2;p.mat.opacity=1; }); }
function spawnDrop(hx){ emit(drops,p=>{
  const nx=hx+0.95, ny=PLATE_TOP_W+1.45;            // from nozzle toward cut
  p.mesh.position.set(nx+(Math.random()-.5)*.06,ny,(Math.random()-.5)*.06+0.42);
  const dir=new THREE.Vector3(hx-nx,PLATE_TOP_W-ny,-0.42).normalize().multiplyScalar(0.16+Math.random()*0.05);
  p.vel.copy(dir); p.life=0;p.max=0.55;p.mat.opacity=.85; }); }
function stepParticles(dt){
  for(const c of chips){ if(!c.on)continue; c.life+=dt; if(c.life>=c.max){c.on=false;c.mesh.visible=false;continue;}
    c.vel.y-=0.012; c.vel.multiplyScalar(0.99); c.mesh.position.add(c.vel);
    c.mesh.rotation.x+=c.ang.x;c.mesh.rotation.y+=c.ang.y;c.mesh.rotation.z+=c.ang.z;
    const t=c.life/c.max; c.mat.opacity=1-t*t; const cool=1-t; c.mat.color.setRGB(.3+cool*.7,.3+cool*.2,.3); c.mat.emissiveIntensity=cool*.7;
    if(c.mesh.position.y<-0.4){c.vel.y*=-0.3;c.vel.x*=.5;c.vel.z*=.5;c.mesh.position.y=-0.4;} }
  for(const s of sparks){ if(!s.on)continue; s.life+=dt; if(s.life>=s.max){s.on=false;s.mesh.visible=false;continue;}
    s.vel.y-=0.008; s.mesh.position.add(s.vel); s.mat.opacity=1-s.life/s.max; }
  for(const d of drops){ if(!d.on)continue; d.life+=dt; if(d.life>=d.max){d.on=false;d.mesh.visible=false;continue;}
    d.vel.y-=0.006; d.mesh.position.add(d.vel); d.mat.opacity=.85*(1-d.life/d.max);
    if(d.mesh.position.y<PLATE_TOP_W-0.02){d.on=false;d.mesh.visible=false;} }
}

/* ════════════════ TIMELINE — geometry is a PURE function of t (scrubbable) ════════════════ */
const SEQ=[
  ['ORBIT',3.0,'SETUP \u00b7 '+P.size+' \u00b7 3-HOLE DIE PLATE'],
  ['T1_LOAD',1.0,'T01 \u00b7 TAP DRILL \u2300'+fmt(P.tap)],
  ['T1_PECK',6.0,'G83 PECK DRILL \u2300'+fmt(P.tap)+' \u00b7 HOLE 1'],
  ['T1_RET',0.7,'RETRACT \u00b7 G00'],
  ['T2_LOAD',1.0,'T02 \u00b7 MACHINE TAP '+P.size+'\u00d7'+P.pitch],
  ['T2_IN',3.6,'RIGID TAPPING '+P.size+'\u00d7'+P.pitch],
  ['T2_OUT',2.4,'TAP REVERSE-OUT \u00b7 M04'],
  ['T3_LOAD',1.0,'T03 \u00b7 CLEARANCE DRILL \u2300'+fmt(P.cl)],
  ['T3_D2',3.0,'G81 DRILL \u2300'+fmt(P.cl)+' \u00b7 HOLE 2'],
  ['T3_MOVE',0.8,'G00 \u00b7 NEXT POSITION'],
  ['T3_D3',3.0,'G81 DRILL \u2300'+fmt(P.cl)+' \u00b7 HOLE 3'],
  ['T3_RET',0.6,'RETRACT \u00b7 G00'],
  ['T4_LOAD',1.0,'T04 \u00b7 COUNTERBORE \u2300'+fmt(P.cb)],
  ['T4_CUT',3.0,'C\u2019BORE \u2300'+fmt(P.cb)+' \u00d7 '+fmt(P.cbd)+' DEEP'],
  ['T4_RET',0.6,'RETRACT \u00b7 G00'],
  ['T5_LOAD',1.0,'T05 \u00b7 COUNTERSINK \u2300'+fmt(P.csk)+' \u00d7 90\u00b0'],
  ['T5_CUT',2.2,'CSK \u2300'+fmt(P.csk)+' \u00d7 90\u00b0'],
  ['T5_RET',0.6,'RETRACT \u00b7 G00'],
  ['FIT',5.4,'FASTENER FIT CHECK \u00b7 BOLT / SHCS / FHCS'],
  ['SECTION',6.0,'SECTION A-A \u00b7 WHY THE CHART WORKS'],
  ['HOLD',4.0,'JOB COMPLETE \u00b7 FREE ORBIT'],
];
let acc=0; const PHASE=SEQ.map(([k,d,n])=>{const o={key:k,s:acc,e:acc+d,n};acc+=d;return o;});
const TOTAL=acc;
function phaseAt(t){ for(let i=PHASE.length-1;i>=0;i--) if(t>=PHASE[i].s) return PHASE[i]; return PHASE[0]; }
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, easeO=t=>1-Math.pow(1-t,3), easeI=t=>t*t, L=(a,b,t)=>a+(b-a)*t;
const clamp01=t=>Math.min(1,Math.max(0,t));
function span(t,k){ const p=PHASE.find(p=>p.key===k); return clamp01((t-p.s)/(p.e-p.s)); }
function after(t,k){ const p=PHASE.find(p=>p.key===k); return t>=p.e; }

/* peck profile: 3 pecks then breakthrough — returns drill depth 0..(T+tip) */
function peckDepth(p, full){
  const seg=1/3.4;
  let d=0;
  for(let i=0;i<3;i++){
    const s0=i*seg, plunge=s0+seg*0.62, ret=s0+seg*0.85;
    const target=full*0.30*(i+1);
    const prev=full*0.30*i*0.6;
    if(p<s0) return d;
    if(p<plunge){ return L(prev, target, easeI((p-s0)/(plunge-s0))); }
    if(p<ret){ return L(target, target*0.6, (p-plunge)/(ret-plunge)); }
    d=target*0.6;
  }
  const s0=3*seg;
  return L(full*0.9*0.6, full*1.0, easeO(clamp01((p-s0)/(1-s0))));
}
/* committed (max-so-far) cut depth for the hole plug from peck profile */
function peckCut(p, full){
  let m=0; const steps=40;
  for(let i=0;i<=Math.floor(p*steps);i++) m=Math.max(m,peckDepth(i/steps,full));
  return Math.max(m,peckDepth(p,full));
}

/* camera poses */
const POSE={
  orbitT:new THREE.Vector3(0,2.4,0),
  cut:i=>({p:new THREE.Vector3(HX[i]+5.4,7.2,6.8),t:new THREE.Vector3(HX[i],PLATE_TOP_W-0.3,0)}),
  wide:{p:new THREE.Vector3(11,8,11),t:new THREE.Vector3(0,2.6,0)},
  fit:{p:new THREE.Vector3(0,7.4,10),t:new THREE.Vector3(0,PLATE_TOP_W-0.2,0)},
  sect:{p:new THREE.Vector3(0,6.2,9.6),t:new THREE.Vector3(0,PLATE_TOP_W-T_U/2,0)},
};
let camAuto=true, userTouched=false;
renderer.domElement.addEventListener('pointerdown',()=>{userTouched=true;});
function camLerp(pose,k){ if(userTouched&&!animPlaying)return; camera.position.lerp(pose.p,k); controls.target.lerp(pose.t,k); }

/* drive everything from t */
let spinAngle=0, lastT=0;
function apply(t, dt){
  const ph=phaseAt(Math.min(t,TOTAL-0.001));
  const pt=clamp01((t-ph.s)/(ph.e-ph.s));
  document.getElementById('progressFill').style.width=(Math.min(t,TOTAL)/TOTAL*100)+'%';
  document.getElementById('phaseLabel').textContent=ph.n;

  /* defaults each frame */
  let headX=0, headY=HEAD_REST, tool='none', spinRate=0, glow=0, coolant=false, chipAt=-1, chipR=0;
  const FULL_TAPDRILL=T_U+tools.tapDrill.userData.tipH;
  const FULL_CLR=T_U+tools.clrDrill.userData.tipH;

  /* committed material state (pure in t) */
  const tapCut  = after(t,'T1_PECK')?T_U : (t>PHASE[2].s? Math.min(T_U,peckCut(span(t,'T1_PECK'),FULL_TAPDRILL)) : 0);
  const thread  = after(t,'T2_IN')?1 : span(t,'T2_IN');
  const cl2Cut  = after(t,'T3_D2')?T_U : Math.min(T_U, easeI(span(t,'T3_D2'))*FULL_CLR);
  const cl3Cut  = after(t,'T3_D3')?T_U : Math.min(T_U, easeI(span(t,'T3_D3'))*FULL_CLR);
  const cbFrac  = after(t,'T4_CUT')?1 : easeI(span(t,'T4_CUT'));
  const cskFrac = after(t,'T5_CUT')?1 : easeI(span(t,'T5_CUT'));

  setCylPlug(plugTap, tapCut);
  setCylPlug(plugCb1, cl2Cut);
  setCylPlug(plugCsk1, cl3Cut);
  setRingPlugTopDown(plugCb2, cbFrac, CBD_U);
  setRingPlugTopDown(plugCsk2, cskFrac, CSKD_U);
  threadMesh.visible=thread>0.001;
  threadMesh.geometry.setDrawRange(0,Math.floor(threadTotal*thread));

  /* fasteners */
  const fitP=span(t,'FIT');
  bolts.forEach((b,i)=>{
    const lp=clamp01(fitP*3.4-i*1.05);
    b.visible=lp>0;
    if(lp>0){ const drop=easeO(Math.min(1,lp*1.4)), seat=b.userData.seatY;
      b.position.y=L(seat+3.2,seat,drop);
      b.rotation.y=lp*16;
      b.position.x=HX[i]; }
  });

  /* section plane */
  const sectP=after(t,'SECTION')?1:span(t,'SECTION');
  clipPlane.constant = (ph.key==='SECTION'||after(t,'SECTION')) ? L(mm(PLATE.D)/2+0.5, 0, ease(sectP)) : 100;
  sectLight.intensity = (ph.key==='SECTION'||after(t,'SECTION')) ? ease(sectP)*1.6 : 0;

  switch(ph.key){
    case 'ORBIT':{ const a=-0.35*Math.PI+ease(pt)*Math.PI*0.7; camera.position.set(Math.sin(a)*16,9.6,Math.cos(a)*16); controls.target.set(0,3.4,0); break; }
    case 'T1_LOAD':{ tool='tapDrill'; headX=L(0,HX[0],ease(pt)); camLerp(POSE.cut(0),.06); break; }
    case 'T1_PECK':{ tool='tapDrill'; headX=HX[0]; spinRate=0.5;
      const d=peckDepth(pt,FULL_TAPDRILL);
      headY=touchY(tools.tapDrill)-d;
      const cutting=d>0.02 && d>tapCut-0.25;
      if(cutting){ glow=1.1+Math.sin(t*16)*.4; chipAt=0; chipR=R.tap; coolant=true;
        if(d>T_U*0.97&&d<T_U*1.05) for(let i=0;i<2;i++) spawnSpark(HX[0],PLATE_TOP_W-T_U+vise.position.y*0,R.tap); }
      camLerp(POSE.cut(0),.05); break; }
    case 'T1_RET':{ tool='tapDrill'; headX=HX[0]; headY=L(touchY(tools.tapDrill)-FULL_TAPDRILL*0.6,HEAD_REST,easeO(pt)); spinRate=.2*(1-pt); break; }
    case 'T2_LOAD':{ tool=pt<.4?'none':'tap'; headX=HX[0]; camLerp(POSE.cut(0),.06); break; }
    case 'T2_IN':{ tool='tap'; headX=HX[0]; spinRate=0.14;                       // slow synchronized feed
      headY=touchY(tools.tap)-easeI(pt)*(T_U+tools.tap.userData.tipH*0.8);
      coolant=true; glow=0.4; camLerp(POSE.cut(0),.04); break; }
    case 'T2_OUT':{ tool='tap'; headX=HX[0]; spinRate=-0.2;                      // reverse out
      headY=L(touchY(tools.tap)-(T_U+tools.tap.userData.tipH*0.8),HEAD_REST,easeI(pt)); break; }
    case 'T3_LOAD':{ tool=pt<.4?'none':'clrDrill'; headX=L(HX[0],HX[1],ease(pt)); camLerp(POSE.cut(1),.06); break; }
    case 'T3_D2':{ tool='clrDrill'; headX=HX[1]; spinRate=0.45;
      const d=easeI(pt)*FULL_CLR; headY=touchY(tools.clrDrill)-d;
      glow=1.1+Math.sin(t*15)*.4; chipAt=1; chipR=R.cl; coolant=true; camLerp(POSE.cut(1),.05); break; }
    case 'T3_MOVE':{ tool='clrDrill'; headX=L(HX[1],HX[2],ease(pt)); headY=L(touchY(tools.clrDrill)-FULL_CLR,HEAD_REST,Math.min(1,pt*2)); 
      if(pt>0.5) headY=L(HEAD_REST,HEAD_REST,1); camLerp(POSE.cut(2),.06); break; }
    case 'T3_D3':{ tool='clrDrill'; headX=HX[2]; spinRate=0.45;
      const d=easeI(pt)*FULL_CLR; headY=touchY(tools.clrDrill)-d;
      glow=1.1+Math.sin(t*15)*.4; chipAt=2; chipR=R.cl; coolant=true; camLerp(POSE.cut(2),.05); break; }
    case 'T3_RET':{ tool='clrDrill'; headX=HX[2]; headY=L(touchY(tools.clrDrill)-FULL_CLR,HEAD_REST,easeO(pt)); break; }
    case 'T4_LOAD':{ tool=pt<.4?'none':'cb'; headX=L(HX[2],HX[1],ease(pt)); camLerp(POSE.cut(1),.06); break; }
    case 'T4_CUT':{ tool='cb'; headX=HX[1]; spinRate=0.3;
      headY=(PLATE_TOP_W-easeI(pt)*CBD_U)-(TOOL_Y+tools.cb.userData.cutFace);
      glow=1.3+Math.sin(t*14)*.5; chipAt=1; chipR=R.cb; coolant=true; camLerp(POSE.cut(1),.05); break; }
    case 'T4_RET':{ tool='cb'; headX=HX[1]; headY=L((PLATE_TOP_W-CBD_U)-(TOOL_Y+tools.cb.userData.cutFace),HEAD_REST,easeO(pt)); break; }
    case 'T5_LOAD':{ tool=pt<.4?'none':'csk'; headX=L(HX[1],HX[2],ease(pt)); camLerp(POSE.cut(2),.06); break; }
    case 'T5_CUT':{ tool='csk'; headX=HX[2]; spinRate=0.32;
      headY=(PLATE_TOP_W-easeI(pt)*CSKD_U)-(TOOL_Y+tools.csk.userData.coneTop)-tools.csk.userData.tipH;
      glow=1.0+Math.sin(t*14)*.4; chipAt=2; chipR=R.csk; coolant=true; camLerp(POSE.cut(2),.05); break; }
    case 'T5_RET':{ tool='csk'; headX=HX[2]; headY=L((PLATE_TOP_W-CSKD_U)-(TOOL_Y+tools.csk.userData.coneTop)-tools.csk.userData.tipH,HEAD_REST,easeO(pt)); break; }
    case 'FIT':{ tool='none'; const a=pt*Math.PI*0.5; camera.position.lerp(new THREE.Vector3(Math.sin(a+0.6)*8.5,6.2,Math.cos(a+0.6)*8.5),.05);
      controls.target.lerp(new THREE.Vector3(0,PLATE_TOP_W-0.2,0),.05); break; }
    case 'SECTION':{ tool='none'; camLerp(POSE.sect,.05); break; }
    case 'HOLD':{ tool='none'; const a=t*0.12; camera.position.lerp(new THREE.Vector3(Math.sin(a)*9,5.6,Math.cos(a)*9),.02);
      controls.target.lerp(new THREE.Vector3(0,PLATE_TOP_W-T_U/2,0),.03); break; }
  }

  head.position.x=headX; head.position.y=headY;
  spinAngle+=spinRate*(dt*60); spindle.rotation.y=spinAngle;
  if(tool!==curTool){ setTool(tool); curTool=tool; }
  cutGlow.intensity=glow; if(chipAt>=0){ cutGlow.position.set(HX[chipAt],PLATE_TOP_W+0.08,0); }
  if(chipAt>=0&&dt>0){ for(let i=0;i<2;i++) if(Math.random()<.85) spawnChip(HX[chipAt],PLATE_TOP_W,chipR); if(Math.random()<.5) spawnSpark(HX[chipAt],PLATE_TOP_W,chipR); }
  if(coolant&&dt>0){ if(Math.random()<.9) spawnDrop(headX); }

  /* spec bar highlight */
  const hl = ph.key.startsWith('T1')||ph.key.startsWith('T2') ? 'Tap'
           : ph.key.startsWith('T3') ? 'Clr'
           : ph.key.startsWith('T4') ? 'Cb'
           : ph.key.startsWith('T5') ? 'Csk' : null;
  ['Tap','Clr','Cb','Csk'].forEach(k=>document.getElementById('specItem'+k).classList.toggle('active',k===hl));

  /* projected callouts during SECTION/HOLD */
  const showCo = ph.key==='SECTION'&&pt>0.35 || ph.key==='HOLD';
  [['coTap',HX[0]],['coCb',HX[1]],['coCsk',HX[2]]].forEach(([id,hx])=>{
    const el=document.getElementById(id);
    el.classList.toggle('show',showCo);
    if(showCo){ const v=new THREE.Vector3(hx,PLATE_TOP_W+0.1,0).project(camera);
      el.style.left=((v.x*.5+.5)*innerWidth)+'px'; el.style.top=((-v.y*.5+.5)*innerHeight)+'px'; }
  });
  return ph;
}
let curTool='__';

/* ════════════════ SOUND (off by default, WebAudio) ════════════════ */
let audio=null, sndOn=false;
function audioInit(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain(); master.gain.value=0.0; master.connect(ctx.destination);
  const osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=85;
  const oG=ctx.createGain(); oG.gain.value=0; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  osc.connect(lp); lp.connect(oG); oG.connect(master); osc.start();
  const buf=ctx.createBuffer(1,ctx.sampleRate*1,ctx.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=0.8;
  const nG=ctx.createGain(); nG.gain.value=0; noise.connect(bp); bp.connect(nG); nG.connect(master); noise.start();
  return {ctx,master,oG,nG,osc};
}
document.getElementById('btnSound').addEventListener('click',function(){
  if(!audio) audio=audioInit();
  sndOn=!sndOn; audio.ctx.resume();
  audio.master.gain.setTargetAtTime(sndOn?0.25:0.0,audio.ctx.currentTime,0.1);
  this.style.background=sndOn?'rgba(37,99,235,.45)':'';
});
function audioStep(spinning,cutting){
  if(!audio||!sndOn)return;
  audio.oG.gain.setTargetAtTime(spinning?0.5:0.0,audio.ctx.currentTime,0.12);
  audio.osc.frequency.setTargetAtTime(spinning?85+Math.abs(spinning)*60:60,audio.ctx.currentTime,0.1);
  audio.nG.gain.setTargetAtTime(cutting?0.22:0.0,audio.ctx.currentTime,0.08);
}

/* ════════════════ PLAYBACK ════════════════ */
let animPlaying=true, speed=1, tCur=0;
const clock=new THREE.Clock();
document.getElementById('btnPlay').addEventListener('click',()=>{
  animPlaying=!animPlaying;
  document.getElementById('playIco').innerHTML=animPlaying?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>';
});
document.getElementById('btnSpeed').addEventListener('click',function(){
  speed = speed===1?2:speed===2?0.5:1; this.textContent=speed+'\u00d7';
});
document.getElementById('btnReplay').addEventListener('click',()=>seek(0,true));
const wrap=document.getElementById('progressWrap');
PHASE.forEach(p=>{ if(p.s===0)return; const d=document.createElement('div'); d.className='phase-tick'; d.style.left=(p.s/TOTAL*100)+'%'; wrap.appendChild(d); });
wrap.addEventListener('click',e=>{ const r=wrap.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL,false); });
function seek(t,reset){
  tCur=Math.max(0,Math.min(TOTAL-0.01,t));
  userTouched=false; animPlaying=true;
  document.getElementById('playIco').innerHTML='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  chips.concat(sparks,drops).forEach(p=>{p.on=false;p.mesh.visible=false;});
  /* snap camera to the phase pose so scrubbing isn't disorienting */
  const ph=phaseAt(tCur);
  const pose = ph.key==='ORBIT'?{p:new THREE.Vector3(15,8.4,0),t:POSE.orbitT}
    : ph.key==='FIT'?POSE.fit : ph.key==='SECTION'||ph.key==='HOLD'?POSE.sect
    : ph.key.startsWith('T1')||ph.key.startsWith('T2')?POSE.cut(0)
    : ph.key==='T3_D3'||ph.key==='T3_MOVE'||ph.key.startsWith('T5')?POSE.cut(2)
    : POSE.cut(1);
  camera.position.copy(pose.p); controls.target.copy(pose.t);
  if(reset){ camera.position.set(15,8.4,0); controls.target.copy(POSE.orbitT); }
}
window.__seek=seek; /* deep-link / test hook */

/* ════════════════ MAIN LOOP ════════════════ */
let hidden=false;
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;});
function loop(){
  requestAnimationFrame(loop);
  if(hidden)return;
  const dt=Math.min(0.05,clock.getDelta());
  if(animPlaying&&tCur<TOTAL) tCur+=dt*speed;
  const ph=apply(tCur, animPlaying?dt*speed:0);
  audioStep(curTool!=='none'?1:0, /CUT|PECK|_D2|_D3|T2_IN/.test(ph.key));
  stepParticles(dt);
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.render(scene,camera);
document.getElementById('loader').classList.add('hidden');
loop();
</script>
