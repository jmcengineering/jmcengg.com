name: Deploy to Azure Static Web Apps

# Publishes the built site to Azure Static Web Apps.
#
# While DNS still points at GitHub Pages this workflow runs alongside
# deploy.yml and publishes to the azurestaticapps.net hostname only — the live
# site is unaffected. It becomes the production path the moment jmcengg.com is
# pointed at Azure, and deploy.yml can be deleted then.
#
# No deployment token is stored in this repository. GitHub proves its identity
# to Entra ID with a short-lived OIDC token, and the workflow reads the Static
# Web App's deployment token from Azure at run time, masked, for that run only.
#
# The Azure jobs skip themselves cleanly until AZURE_CLIENT_ID is set, so this
# file is safe to merge before the Azure side exists.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check nothing shipped with a placeholder in it
        run: ./scripts/check-placeholders.sh dist

      - name: Confirm the Static Web Apps config survived the build
        run: |
          test -f dist/staticwebapp.config.json \
            || { echo "::error::dist/staticwebapp.config.json is missing — routing and security headers would be lost"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('dist/staticwebapp.config.json','utf8'))"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
          if-no-files-found: error

  production:
    name: Publish to production
    needs: build
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: azure-production
      url: ${{ steps.publish.outputs.static_web_app_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          if [ -z "$token" ]; then
            echo "::error::Azure returned an empty deployment token. Check that the app registration has Contributor on ${{ vars.AZURE_RESOURCE_GROUP }}."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish
        id: publish
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Sign out
        if: always()
        run: az logout || true

  preview:
    name: Publish a preview
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Sign out
        if: always()
        run: az logout || true

  close-preview:
    name: Tear down the preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Close the staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: close

      - name: Sign out
        if: always()
        run: az logout || true
