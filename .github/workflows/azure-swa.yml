name: Deploy to Azure Static Web Apps

# Publishes the built site to Azure Static Web Apps.
#
# This is the production deployment path. jmcengg.com and www.jmcengg.com have
# served from Azure since 17 September 2026; GitHub Pages and deploy.yml are
# gone. The azurestaticapps.net hostname still resolves and is useful for
# testing a change against the real platform without touching the domain.
#
# No deployment token is stored in this repository. GitHub proves its identity
# to Entra ID with a short-lived OIDC token, and the workflow reads the Static
# Web App's deployment token from Azure at run time, masked, for that run only.
#
# The Azure jobs skip themselves cleanly until AZURE_CLIENT_ID is set, so this
# file is safe to merge before the Azure side exists.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  # Callable by another workflow. The fortnightly drafting job needs this:
  # a push made with the default GITHUB_TOKEN deliberately does not trigger
  # other workflows, so after that job commits a draft the site would never
  # rebuild and the draft's preview page would 404. It calls this workflow
  # directly instead of relying on its own push to set it off.
  workflow_call:

# Only what every job needs. `pull-requests: write` lives on the two preview
# jobs instead, because this workflow is also called by article-draft.yml, and
# a called workflow may not request more than its caller holds — asking for it
# here made the whole run fail to start, with no jobs and no logs.
permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run the tests
        run: npm test

      - name: Check nothing shipped with a placeholder in it
        run: ./scripts/check-placeholders.sh dist

      - name: Confirm the Static Web Apps config survived the build
        run: |
          test -f dist/staticwebapp.config.json \
            || { echo "::error::dist/staticwebapp.config.json is missing — routing and security headers would be lost"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('dist/staticwebapp.config.json','utf8'))"

      # The deploy jobs do not check the repository out — they only download
      # this artifact — so the managed functions have to travel with the site.
      # The tests are excluded: they are for CI, not for the running API.
      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: |
            dist
            api
            !api/test
          retention-days: 3
          if-no-files-found: error

  production:
    name: Publish to production
    needs: build
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: azure-production
      url: ${{ steps.publish.outputs.static_web_app_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          if [ -z "$token" ]; then
            echo "::error::Azure returned an empty deployment token. Check that the app registration has Contributor on ${{ vars.AZURE_RESOURCE_GROUP }}."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish
        id: publish
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          # The API has no dependencies — no package to install, nothing to
          # bundle — so there is nothing for Oryx to build. staticwebapp.config.json
          # declares the Node runtime it should run on.
          #
          # This logs "Unexpected input(s) 'skip_api_build'" on every run. The
          # action's action.yml has not listed it for years, but it is passed
          # to the container as INPUT_SKIP_API_BUILD and the deployment engine
          # honours it — the run log says "Skipping step to build .../api with
          # Oryx". Do not delete the line to silence the warning; that would
          # hand the API to Oryx, which is the thing being avoided.
          skip_api_build: true

      - name: Sign out
        if: always()
        run: az logout || true

  preview:
    name: Publish a preview
    needs: build
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          # The API has no dependencies — no package to install, nothing to
          # bundle — so there is nothing for Oryx to build. staticwebapp.config.json
          # declares the Node runtime it should run on.
          #
          # This logs "Unexpected input(s) 'skip_api_build'" on every run. The
          # action's action.yml has not listed it for years, but it is passed
          # to the container as INPUT_SKIP_API_BUILD and the deployment engine
          # honours it — the run log says "Skipping step to build .../api with
          # Oryx". Do not delete the line to silence the warning; that would
          # hand the API to Oryx, which is the thing being avoided.
          skip_api_build: true

      - name: Sign out
        if: always()
        run: az logout || true

  close-preview:
    name: Tear down the preview
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_STATIC_WEB_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Close the staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: close

      - name: Sign out
        if: always()
        run: az logout || true
