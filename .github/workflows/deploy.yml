name: Build and deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages.
#
# ONE-TIME SETUP before the first run on main:
#   Repository Settings -> Pages -> Build and deployment -> Source
#   must be changed from "Deploy from a branch" to "GitHub Actions".
# Until that is changed, Pages keeps serving the old branch contents and
# this workflow's deploy step will fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check nothing shipped with a placeholder in it
        run: ./scripts/check-placeholders.sh dist

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
